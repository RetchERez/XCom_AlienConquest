STR_AT_WAR_PLATFORM_RESERVE_UFOPEDIA: Резерв боевых платформ. Кибернетические осадные машины не относятся к биологическим организмам террора. Это платформы, доступ к которым предоставляется после введения доктрины полномасштабной войны. Они собираются из сплавов, элерия и строительных материалов за счёт ресурсов, выделенных Высшим Порядком.
