STR_AT_HUMAN_REPLICATED_EQUIPMENT_TEXT: Изученное полевое снаряжение людей, предназначенное для воспроизведения технологиями Кидонии. Инопланетные экипажи могут использовать найденные или скопированные образцы. Для производства требуется соответствующее исследовательское разрешение и ресурсы мастерских.
STR_AT_HUMAN_REPLICATED_AIRCRAFT_TEXT: Изучение захваченных человеческих авиационных систем позволило выявить конструкцию этого вооружения. Для его воспроизведения необходимы анализ систем и соответствующее разрешение Кидонии. Оригинальный корпус инопланетного НЛО остаётся без изменений.

