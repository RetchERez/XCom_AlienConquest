STR_AT_SECTOID_SOLDIER: Солдат-сектойд
STR_AT_SECTOPOD_TERRORIST: Сектопод
STR_AT_SECTOPOD_TERRORIST_UFOPEDIA: Сектопод. Осадная боевая машина, предназначенная для противников, переживших менее серьёзные предупреждения. Она не продвигается по кастовой иерархии. Её выпускают на поле боя, наводят на цель, ремонтируют и внушают с её помощью страх.
STR_AT_SHORT_RANGE_SCANNER: Сканер ближнего радиуса действия
STR_AT_SHORT_RANGE_SCANNER_UFOPEDIA: Сканеры ближнего радиуса действия обеспечивают локальное обнаружение объектов вокруг инопланетной базы. По сравнению с полноценной орбитальной сетью они примитивны, но вполне подходят для предупреждения о деятельности людей поблизости.
STR_AT_SILACOID_TERRORIST: Силакоид
STR_AT_SILACOID_TERRORIST_UFOPEDIA: Силакоид. Живое зажигательное средство прорыва, медлительное по человеческим меркам и чрезвычайно устойчивое к уничтожению. Его ценность заключается в блокировании позиций, оказании давления и вытеснении X-COM с мест, которые противник считал безопасными.
STR_AT_SKYRANGER_AMBUSH_TIMING: Засада на «Скайрейнджер»
STR_AT_SKYRANGER_AMBUSH_TIMING_UFOPEDIA: "Засада на «Скайрейнджер». Изучает периоды уязвимости войск X-COM во время развёртывания сил реагирования и помогает инопланетному командованию решить, следует ли отступить, заманить противника в ловушку или атаковать высаживающиеся подразделения."
STR_AT_SKYRANGER_RESPONSE_DOCTRINE: Анализ «Скайрейнджера»
STR_AT_SKYRANGER_RESPONSE_DOCTRINE_UFOPEDIA: "Анализ времени прибытия транспортных самолётов X-COM и моделей развёртывания полевых подразделений. Понимание особенностей реагирования «Скайрейнджера» помогает определить, когда завершить выполнение задач, отступить или спровоцировать появление сил противника.\n\nДальнейшие исследования: Эскалация открытой войны, Время прибытия «Скайрейнджера». Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_SKYRANGER_RESPONSE_WINDOW: "Время прибытия «Скайрейнджера»"
STR_AT_SKYRANGER_RESPONSE_WINDOW_UFOPEDIA: "Время прибытия «Скайрейнджера». Изучает время развёртывания войск X-COM после обнаружения НЛО, посадок и появления материалов, которые можно захватить. Помогает планировать эвакуацию и избегать засад.\n\nДальнейшие исследования: Засада на «Скайрейнджер», Сокрытие места крушения, Зоны эвакуации, Эвакуация после крушения. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_SKYRANGER_WINDOW_REPORT: Отчёт о временном интервале «Скайрейнджера»
STR_AT_SKYRANGER_WINDOW_REPORT_UFOPEDIA: Отчёт о временном интервале «Скайрейнджера». Оценивает, сколько времени инопланетные подразделения могут оставаться на поверхности до прибытия поискового или штурмового отряда X-COM.
STR_AT_SMALL_SCOUT_CRAFT: Зонд
STR_AT_SMALL_SCOUT_CRAFT_UFOPEDIA: Зонд. Расходуемый глаз и коготь для первого контакта. Он проверяет радиолокационное покрытие, дисциплину посадки и маршруты эвакуации. В случае потери он должен оставить людей в неведении относительно того, был ли это зонд или простая ошибка.
STR_AT_SNAKEMAN_CASTE: Змеелюд
STR_AT_SNAKEMAN_CASTE_UFOPEDIA: Змеелюд. Холодная мускулатура для жаркого климата, руин и продолжительных наземных операций. Змеелюди могут выполнять функции навигаторов, инженеров и командиров, однако их биология не подходит для назначения на должности медиков.
STR_AT_SNAKEMAN_COMMANDER: Командир-змеелюд
STR_AT_SNAKEMAN_ENGINEER: Инженер-змеелюд
