STR_AT_EARTH_CAPITULATION_RECORD_UFOPEDIA: Итоговый стратегический отчёт, подтверждающий, что правительства Земли, ресурсы X-COM и сохранившиеся сети сопротивления больше не способны помешать установлению инопланетного господства. Он отмечает момент, когда организованное сопротивление уже не может сдерживать вторжение.
STR_AT_FINAL_STATUS_REPORT_UFOPEDIA: Итоговый отчёт командования Alien Conquest. В нём обобщены ход вторжения, сопротивление X-COM, власть Кидонии и окончательный исход кампании.
STR_AT_MOD_TITLE: 'X-COM: Alien Conquest'
