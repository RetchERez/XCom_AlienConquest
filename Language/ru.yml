STR_AT_ENGINE_OPERATION_ONLY: "Цель отправки на геосцене"
STR_AT_DEPRECATED_MANUFACTURE_OPERATION: "Только отправка на геосцене"
STR_AT_XCOM_AIR_PATROL_ANALYZED: "Патрули X-COM"
STR_AT_XCOM_AIR_PATROL_ANALYZED_UFOPEDIA: "Телеметрия воздушного боя, следы применения вооружения и особенности полёта, собранные после столкновения с самолётом X-COM. Перехватчики не создают наземных точек высадки: они патрулируют заданные зоны, после чего возвращаются на базу либо гибнут в воздушном бою."
STR_AT_XCOM_AIR_PATROL_ANALYSIS: "Патрули X-COM"
STR_AT_XCOM_AIR_PATROL_ANALYSIS_UFOPEDIA: "Воздушные патрули X-COM проверяют сообщения о наблюдениях, прочёсывают вероятные маршруты и вынуждают инопланетные корабли прерывать операции или вступать в воздушный бой. Потери патрулей остаются стратегическими событиями, а не наземными задачами."
STR_AT_SECTOID_REINFORCEMENT_PROTOCOL_UFOPEDIA: Устаревшее ограничение удалено из активной цепочки развития. Сектойды поступают через покупку или вербовку, а затем повышают свой статус благодаря боевым заслугам.
STR_AT_EARTH_CAPITULATION_PROTOCOL_UFOPEDIA: "Капитуляция Земли. Вторжение достигает решающей стадии давления. Целью является человеческий вид. Террор, внедрение, сокрытие следов крушений, расширение сети установок, изучение сил реагирования и поиск баз теперь объединяются в единую стратегию. Цель - не выиграть каждое сражение, а сделать организованное сопротивление людей структурно невозможным.\n\nДальнейшие исследования: Финальная готовность. Остальные предварительные условия и требования к найденным образцам сохраняются."
STR_AT_FINAL_INVASION_CAMPAIGN_VICTORY_UFOPEDIA: "Финальная готовность. Кидония признаёт земное подразделение решающей силой. Планета близка к капитуляции, либо X-COM близка к обнаружению источника вторжения. Все оставшиеся приказы направлены на достижение победы до того, как люди смогут превратить свои знания в возможность добраться до Кидонии."
