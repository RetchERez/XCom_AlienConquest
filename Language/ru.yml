# FIXED77 exact approved ending words on inverted native slides.
STR_AT_ENDING_VICTORY_1: "Сопротивление человечества потерпело поражение. Одно за другим правительства Земли отказываются от поддержки X-COM и подписывают себе приговор, отдавая собственное будущее. Они принимают наши обещания порядка и выживания. Кидония предлагает им лишь повиновение. Они ещё не понимают, какой ценой обернётся их покорность. Кампания вступает в заключительную фазу. Города охвачены огнём, воздух и моря отравлены, а человеческие армии рушатся под натиском превосходящих сил."
STR_AT_ENDING_VICTORY_2: "Выжившие уже не те, что прежде. Целые поколения страдают от мутаций и разрухи. Оставшихся в живых сгоняют в трудовые лагеря, обращают в рабство под властью Кидонии, а Землю превращают в колонию Кидонии. Полезные человеческие органы и ткани изымают для использования в качестве биологического сырья. Измождённых рабочих и непригодные останки перерабатывают в топливо для биореакторов, питающих комплексы машин с искусственным интеллектом, управляющие завоёванным миром. УНИЧТОЖИТЬ ЧЕЛОВЕЧЕСТВО."
STR_AT_ENDING_DEFEAT_1: "Со временем X-COM удалось восстановить наши технологии и проследить сеть вторжения до самой Кидонии. Человеческие штурмовые корабли достигли Марса. X-COM прорвалась во внутреннюю камеру. Командное ядро Кидонии оказалось беззащитным, и человеческое оружие теперь угрожает самому сердцу вторжения."
STR_AT_ENDING_DEFEAT_2: "Кидония содрогается под натиском людей. Человеческое оружие уничтожает командное ядро. Древние марсианские сооружения рушатся, и старая империя больше не в силах защитить свою родину."
STR_AT_ENDING_DEFEAT_3: "Командные ретрансляторы один за другим выходят из строя. Камеры выращивания перестают работать, запечатанные арсеналы погружаются во тьму, а оставшиеся на Земле ячейки теряют связь с командованием."
STR_AT_ENDING_DEFEAT_4: "Сеть вторжения рушится по всей планете, а человеческое сопротивление выживает. Изолированные инопланетные уцелевшие остаются без подкреплений и становятся добычей охотников среди руин разрушенных баз, пока машинный разум Кидонии распадается на безмолвные, изолированные процессы."
STR_AT_ENDING_DEFEAT_5: "КИДОНИЯ ЗАМОЛКЛА."

STR_XCOM_BASE_ASSAULT: "Штурм базы X-COM"
STR_XCOM_BASE_ASSAULT_BRIEFING: "Наш боевой корабль достиг человеческой базы. Уничтожьте её защитников и выведите базу из строя. Успешный штурм ослабит X-COM и продвинет вторжение. Чтобы отступить, верните выживших бойцов и пленников к входному лифту, прежде чем прервать операцию."

STR_AT_TERROR_DEPLOYMENT_AUTHORIZATION: Разрешение на применение сил террора
STR_AT_TERROR_DEPLOYMENT_AUTHORIZATION_UFOPEDIA: "Высшее командование разрешает использовать Дредноуты и Кибердиски в операциях на Земле.\n\nПокупка / набор: Дредноут - 2 600 000 $, срок доставки - четырнадцать дней; Кибердиск - 450 000 $, срок доставки - один день.\n\nЗаправьте корабль, загрузите снаряжение и назначьте биологический экипаж. Кибердиск обеспечивает доставку боевого груза для городского террора, но не заменяет экипаж. Публичные атаки раскрывают вторжение. Повторные террористические рейды оказывают всё меньшее стратегическое давление; захваченные грузы и результаты боевых действий по-прежнему учитываются.\n\nДоктрина террора остаётся передовым направлением стратегических исследований. Для остальных боевых единиц сохраняются собственные разрешения на применение."
