STR_AT_STUN_AND_CAPTURE_TOOLS_UFOPEDIA: Запасы малой пусковой установки, парализующей бомбы и зонда для чтения мыслей обеспечивают проведение операций по захвату. Живые люди, особенно сотрудники X-COM, учёные, инженеры и командиры, предоставляют гораздо больше разведывательной информации, чем трупы.
STR_AT_SUPPLY_SHIP_CRAFT: Транспортный корабль
STR_AT_SUPPLY_SHIP_CRAFT_UFOPEDIA: Транспортный корабль. Главная артерия оккупации Земли. Он перевозит элерий, организмы и строительные материалы между скрытыми объектами. Его маршруты опаснее собственного вооружения, поскольку повторяющиеся схемы полётов могут выдать расположение базы.
STR_AT_TACTICAL_SCENARIO_DATA: Данные тактических сценариев
STR_AT_TACTICAL_SCENARIO_DATA_UFOPEDIA: Данные тактических сценариев. Систематизированные полевые предположения, используемые для подготовки инопланетных подразделений к последующей генерации тактических заданий.
STR_AT_TERRAN_INTELLIGENCE: РАЗВЕДКА ЗЕМЛИ
STR_AT_TERRAN_RESOURCE_MAPPING: Разведка ресурсов
STR_AT_TERRAN_RESOURCE_MAPPING_UFOPEDIA: "Разведка ресурсов. Данные первых рейдов превращаются в логистические сведения о Земле, позволяющие отличать ценные материалы от расходуемых запасов и ресурсов, извлечение которых слишком заметно и опасно.\n\nДальнейшие исследования: Скрытое давление, Местная оборона, Инфильтрация, Новая база, Адаптация к Земле. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_TERROR_SHIP_CRAFT: Линкор террора
STR_AT_TERROR_SHIP_CRAFT_UFOPEDIA: Линкор террора. Орудие публичного устрашения. Он жертвует скрытностью ради паники, заставляя правительства требовать решительных действий, а X-COM - раскрывать особенности своего реагирования. Его следует запускать только тогда, когда страх оправдывает создаваемые им улики.
STR_AT_TERROR_UNITS: Организмы террора
STR_AT_TERROR_UNITS_UFOPEDIA: "Организмы террора. Жнецы, хризаллиды, силакоиды, целатиды, кибердиски и сектоподы являются средствами эскалации. Они не убеждают и не оккупируют территории. Они разрушают привычный уклад, опустошают улицы и заставляют X-COM действовать на условиях Кидонии."
STR_AT_UFO_FLEET: АРМАДА
STR_AT_UFO_HANGAR: Ангар НЛО
STR_AT_UFO_HANGAR_UFOPEDIA: Ангары НЛО предназначены для хранения инопланетных кораблей, заправки, вооружения и подготовки к вылетам на поверхность. Каждая действующая база нуждается в защищённом ангаре достаточной вместимости.
