STR_AT_MEDIUM_SCOUT_EMITTER: "Разведывательный плазменный излучатель"
STR_AT_MEDIUM_SCOUT_EMITTER_UFOPEDIA: "Разведывательный плазменный излучатель. Слабая система плазменной защиты с малой дальностью действия, предназначенная для корабля, которому важнее уйти от преследования, чем вступать в воздушный бой."
STR_AT_LARGE_SCOUT_EMITTER: "Плазменный излучатель исследовательского корабля"
STR_AT_LARGE_SCOUT_EMITTER_UFOPEDIA: "Плазменный излучатель исследовательского корабля. Лёгкое оружие с увеличенной дальностью действия, достаточной для сдерживания преследователей до завершения разведывательного маршрута."
STR_AT_HARVESTER_EMITTER: "Плазменный излучатель сборщика"
STR_AT_HARVESTER_EMITTER_UFOPEDIA: "Плазменный излучатель сборщика. Умеренно мощное вооружение инопланетного корабля, перевозящего ткани, продовольствие и материалы, а не стремящегося к господству в воздухе."
STR_AT_ABDUCTOR_EMITTER: "Плазменный излучатель похитителя"
STR_AT_ABDUCTOR_EMITTER_UFOPEDIA: "Плазменный излучатель похитителя. Компактная система защиты корабля для захвата образцов. Её задача - обеспечить отход, а не вести бой."
STR_AT_SUPPLY_SHIP_EMITTER: "Плазменный излучатель транспортника"
STR_AT_SUPPLY_SHIP_EMITTER_UFOPEDIA: "Плазменный излучатель транспортника. Достаточно мощный, чтобы наказать перехватчиков, но установлен на корабле, выполняющем логистические задачи, для которого маршруты важнее вооружения."
STR_AT_TERROR_SHIP_EMITTER: "Плазменный излучатель дредноута"
STR_AT_TERROR_SHIP_EMITTER_UFOPEDIA: "Плазменный излучатель дредноута. Тяжёлый излучатель для открытых операций, в которых паника оправдывает раскрытие присутствия."
STR_AT_BATTLESHIP_EMITTER: "Плазменное копьё боевого корабля"
STR_AT_BATTLESHIP_EMITTER_UFOPEDIA: "Плазменное копьё боевого корабля. Самый мощный профиль вооружения НЛО на земном театре военных действий. Его появление означает, что ячейка больше не скрывается от авиации."

# Alien Conquest FIXED46 operational Xenopedia flare
STR_AT_ABDUCTION_DOCTRINE: Доктрина похищений
STR_AT_ABDUCTION_DOCTRINE_UFOPEDIA: 'Доктрина похищений. Захват людей - отработанная процедура, а не чрезвычайная мера. Живой подопытный позволяет изучить реакцию на страх, пределы памяти, маркеры заболеваний, изменения языка, пороги покорности и социальные привязанности. Трупы дают гораздо меньше ответов.'
STR_AT_OCEANIC_CELL_DOCTRINE: Доктрина океанических ячеек
STR_AT_OCEANIC_CELL_DOCTRINE_UFOPEDIA: 'Доктрина океанических ячеек. Суша - это сфера человеческого влияния: дороги, границы, свидетели, радиолокационные сети и правительства. Вода - это давление, расстояние, тишина и захоронение. Земные ячейки должны по возможности располагаться под поверхностью открытого океана.'
STR_AT_SALVAGE_DENIAL_PROTOCOL: Протокол уничтожения улик
STR_AT_SALVAGE_DENIAL_PROTOCOL_UFOPEDIA: 'Протокол уничтожения улик. X-COM не обязательно побеждать, чтобы извлекать знания. Повреждённая винтовка, труп, источник энергии, фрагмент обшивки или оглушённый пленник могут уже через несколько недель стать основой новой человеческой военной доктрины. Отступление нельзя считать завершённым, пока все доказательства не будут сожжены, закопаны, возвращены или сделаны слишком дорогими для изучения.'
STR_AT_XCOM_RESPONSE_PROFILE: Профиль реагирования X-COM
STR_AT_XCOM_RESPONSE_PROFILE_UFOPEDIA: 'Профиль реагирования X-COM. X-COM - не государство, не армия и не полиция. Это организм, занимающийся сбором улик: он прибывает после контакта, собирает всё, что осталось, и превращает поражение в новую военную доктрину. Каждое брошенное оружие, тело, обломок корпуса или живой пленник сокращает путь от человеческой паники до ответного удара.'
STR_AT_FUNDING_NATION_LEVERAGE: Влияние на финансирующие страны
STR_AT_FUNDING_NATION_LEVERAGE_UFOPEDIA: 'Влияние на финансирующие страны. X-COM вооружают правительства, которые боятся друг друга почти так же сильно, как боятся нас. Чтобы вывести страну из войны, её необязательно завоёвывать. Достаточно задержать её действия, дискредитировать, расколоть, подкупить, запугать или убедить, что X-COM представляет большую угрозу.'
STR_AT_RURAL_TERROR_RAID: Террористический рейд в сельской местности
STR_AT_RURAL_TERROR_RAID_BRIEFING: "Ваш лёгкий корабль приземлился в сельской местности. Рейд вызывает ограниченную панику в регионе и не является террористической атакой на город. X-COM направила наземные силы для ответа. Отразите их нападение и эвакуируйте выживший экипаж через выход из инопланетного НЛО. Привлекать организмы террора или выполнять квоту по уничтожению гражданских не требуется."

