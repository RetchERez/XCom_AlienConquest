STR_AT_CITY_TERROR_DOCTRINE_UFOPEDIA: "Доктрина террора. Определяет, когда страх становится полезнее скрытности. Террор в городах - не бессмысленная жестокость. Это инструмент давления на правительства, финансирование и темпы развёртывания сил X-COM.\n\nДальнейшие исследования: Капитуляция Земли. Остальные предварительные условия и требования к найденным образцам сохраняются."
STR_AT_COUNTRY_INFILTRATION_CHAIN: Внедрение
STR_AT_COUNTRY_INFILTRATION_CHAIN_UFOPEDIA: "Внедрение. Продуманная атака на систему финансирования людей через скомпрометированные учреждения, запуганных чиновников и местные ресурсы, способные задержать прибытие X-COM или лишить её поддержки.\n\nДальнейшие исследования: Капитуляция Земли. Остальные предварительные условия и требования к найденным образцам сохраняются."
STR_AT_CRASH_RECOVERY_RACE_PROTOCOL: Возвращение обломков
STR_AT_CRASH_RECOVERY_RACE_PROTOCOL_UFOPEDIA: "Возвращение обломков. Определяет порядок эвакуации выживших инопланетян, уничтожения того, что невозможно вывезти, и лишения X-COM обломков, которые в противном случае могли бы стать человеческим оружием будущего.\n\nДальнейшие исследования: Капитуляция Земли. Остальные предварительные условия и требования к найденным образцам сохраняются."
STR_AT_ESTABLISH_INSTALLATION_CHAIN: Новая установка
STR_AT_ESTABLISH_INSTALLATION_CHAIN_UFOPEDIA: "Новая установка. Позволяет выбирать места, где рельеф, скрытность и снабжение обеспечат условия для создания инопланетной базы. Лучшая база - не самая мощная, а та, существование которой X-COM не сможет доказать.\n\nДальнейшие исследования: Капитуляция Земли. Остальные предварительные условия и требования к найденным образцам сохраняются."
STR_AT_XCOM_BASE_TRACE_ANALYSIS: "Местоположение базы X-COM"
STR_AT_XCOM_BASE_TRACE_ANALYSIS_UFOPEDIA: "Местоположение базы X-COM. Повторяющиеся маршруты патрулей, время эвакуации и дисциплина радиосвязи выдают расположение человеческих баз. Одна зацепка - всего лишь шум. Несколько зацепок - уже входная дверь.\n\nДальнейшие исследования: Штурм базы, Капитуляция Земли. Остальные предварительные условия и требования к найденным образцам сохраняются."
STR_AT_XCOM_BASE_ASSAULT_PLANNING: Штурм базы
STR_AT_XCOM_BASE_ASSAULT_PLANNING_UFOPEDIA: "Штурм базы. Планирование атаки на человеческую базу. Подобный удар должен уничтожить запасы, личный состав и командные данные, а также развеять иллюзию, будто подземные стены способны защитить людей.\n\nДальнейшие исследования: Финальная готовность, Высший порядок эфириалов. Остальные предварительные условия и требования к найденным образцам сохраняются."
