STR_AT_VERSION_099: Этап разработки Alien Conquest v0.99
STR_AT_XCOM_ALERT_DOSSIER: Досье об уровне готовности X-COM
STR_AT_XCOM_ALERT_DOSSIER_UFOPEDIA: Досье об уровне готовности X-COM. Сжатый разведывательный профиль осведомлённости людей после неоднократной инопланетной активности. Используется для моделирования того, насколько быстро отдельные сообщения об обнаружениях превращаются в организованную систему реагирования вместо разрозненных проявлений паники.
STR_AT_XCOM_ALERT_LEVEL: Уровень готовности X-COM
STR_AT_XCOM_ALERT_LEVEL_UFOPEDIA: "Уровень готовности X-COM. Разрозненные сообщения людей превратились в организованную доктрину реагирования. Теперь каждое заметное действие инопланетян способствует совершенствованию радиолокационного покрытия Земли, работы поисковых групп и сроков перехвата.\n\nДальнейшие исследования: Патрули перехватчиков, Время прибытия «Скайрейнджера», Местная оборона, Доктрина террора. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_XCOM_OPERATIVE_AUTOPSY: Вскрытие человека
STR_AT_XCOM_OPERATIVE_AUTOPSY_UFOPEDIA: Объединено с исследованием «Вскрытие человека» в версии 1.0. Оперативники X-COM являются людьми; их военная ценность учитывается через награды за разведывательные сведения о реагировании противника, а не посредством отдельной ветки вскрытия. Модели поведения, боевая подготовка и физические пределы человеческого тактического персонала.
STR_AT_XCOM_OPERATIVE_CORPSE: Тело человека
STR_AT_XCOM_ORGANIZATION: Структура X-COM
STR_AT_XCOM_ORGANIZATION_UFOPEDIA: "Структура X-COM. Компактная человеческая военная организация, финансируемая напуганными государствами. Её сила заключается не в численности, а в способности быстро превращать найденные инопланетные доказательства в новые доктрины, вооружение и ответные удары.\n\nДальнейшие исследования: Баллистическое оружие людей, Человеческая броня, Протокол похищения, Реакция X-COM, Инфильтрация. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_XCOM_RESPONSE_ANALYSIS_CELL: Аналитический центр реагирования X-COM
STR_AT_XCOM_RESPONSE_REPORT: Отчёт о реагировании X-COM
STR_AT_XCOM_RESPONSE_REPORT_UFOPEDIA: Отчёт о реагировании X-COM. Обработанный массив разведывательных данных, описывающий реакцию X-COM на обнаружения, посадки и найденные инопланетные материалы. Этот отчёт служит основой для последующих исследований угроз.
STR_AT_XCOM_RESPONSE_STUDY: Реакция X-COM
STR_AT_XCOM_RESPONSE_STUDY_UFOPEDIA: "Реакция X-COM. Возвращённые полевые разведданные используются для прогнозирования того, когда обнаружение перерастёт в перехват, когда перехват превратится в зону высадки, а когда зона высадки станет местом проведения вскрытия.\n\nДальнейшие исследования: Баллистическое оружие людей, Человеческая броня, Модель перехватчиков, Анализ «Скайрейнджера», Радиолокационные средства противодействия, Скрытое давление, Уровень готовности X-COM, Контроль паники сектойдов, Мандат на масштабную войну, Полевое оборудование, Копирование сканеров. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_XENOPAEDIA_OVERVIEW: Обзор вторжения на Землю
STR_AT_XENOPAEDIA_OVERVIEW_UFOPEDIA: 'Обзор вторжения на Землю. Земная ячейка - не флот завоевателей. Это скрытое нервное окончание Кидонии: наблюдать, захватывать, отступать и уничтожать улики. Каждый оставленный труп, гильза и обломок корабля учит X-COM тому, как нас убивать.'
