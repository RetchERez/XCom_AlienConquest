STR_AT_RECON_CONTACT_SIMULATION: Моделирование разведывательного контакта
STR_AT_RECON_OPERATION_CACHE: Комплект для разведывательной операции
STR_AT_REPRODUCTION_CHAMBER: Камера размножения
STR_AT_REPRODUCTION_CHAMBER_UFOPEDIA: Камеры размножения обеспечивают биологическое восполнение личного состава, подготовку организмов террора и содержание специализированных организмов земной ячейки. Их использование строго контролируется разрешениями Кидонии.
STR_AT_RESEARCH_CHAMBER: Исследовательская камера
STR_AT_RESEARCH_CHAMBER_UFOPEDIA: 'Исследовательские камеры не открывают новые инопланетные технологии. Кидония уже владеет всеми необходимыми военными знаниями. Назначение камер - адаптировать это превосходство к условиям Земли: изучать биологию людей, их вооружение, особенности реагирования X-COM, атмосферу, радиолокационные системы, логистику, разрешения на использование организмов террора и доктрину окончательной капитуляции.'
STR_AT_CYDONIAN_RESEARCH_DOCTRINE: Доктрина исследований Кидонии
STR_AT_CYDONIAN_RESEARCH_DOCTRINE_UFOPEDIA: Инопланетные исследования представляют собой адаптацию к условиям нового театра военных действий, а не изобретательство. Сектойды, левитаторы, мутонцы, эфириалы, организмы террора, плазменное оружие, пси-технологии и доктрины применения кораблей уже принадлежат Кидонии. Исследования Земли определяют, когда задействовать эти ресурсы, какие слабости людей можно использовать и как лишить X-COM необходимых доказательств. Выпуск представителей каст, полевое подкрепление и развёртывание кораблей расходуют запасы подкреплений, возможности выращивания организмов, ресурсы кибернетической сборки, элерий и командные приоритеты.
STR_AT_CYDONIAN_ADVANCEMENTS: Достижения Кидонии
STR_AT_CYDONIAN_ADVANCEMENTS_UFOPEDIA: 'Достижения Кидонии. Успехи на поле боя вознаграждаются предоставлением соответствующих разрешений. Органические оперативники могут получать повышение по системе Кидонии в пределах возможностей своего вида. Мутоны являются боевыми и специализированными единицами, ограниченными функциями солдата, навигатора и инженера. Кибердиски и сектоподы - роботизированные платформы террора: они получают разрешение Кидонии, но никогда не повышаются в звании. Жнецы, хризаллиды, силакоиды и целатиды - организмы террора: они получают боевой допуск, но никогда не повышаются в звании. У зомби отсутствует обычный путь развития.'
STR_AT_CYDONIAN_PROMOTION: Повышение по системе Кидонии
STR_AT_COMBAT_GRADE_PROMOTION: Повышение боевого класса
STR_AT_CYDONIAN_AUTHORIZATION: Разрешение Кидонии
STR_AT_COMBAT_GRADE_RELEASE: Боевой допуск
STR_AT_NO_NORMAL_ADVANCEMENT: Без обычного продвижения
STR_AT_RESOURCE_CACHE: Запас ресурсов
STR_AT_RESOURCE_CACHE_UFOPEDIA: Запас ресурсов. Материалы, собранные в ходе контролируемого рейда и обработанные посредством инопланетной логистики. Используются для продвижения исследований и обеспечения строительными материалами.
STR_AT_RESOURCE_RAID_CACHE: Комплект для рейда за ресурсами
STR_AT_RESOURCE_RAID_DOCTRINE: Рейды за ресурсами
STR_AT_RESOURCE_RAID_DOCTRINE_UFOPEDIA: "Рейды за ресурсами. Устанавливает правила безопасного сбора материалов и их сокрытия для первых инопланетных подразделений. Рейд требует затрат элерия, выделенных командованием ресурсов и строительных материалов, после чего возвращается небольшой запас полезных материалов для дальнейшего расширения.\n\nДальнейшие исследования: Разведка ресурсов, Рейд за ресурсами, Протокол сбора биоматериала. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_RESOURCE_RAID_SCENARIO: Рейд за ресурсами
STR_AT_RESOURCE_RAID_SCENARIO_UFOPEDIA: "Рейд за ресурсами. Подготавливает инопланетные подразделения к операции по сбору материалов, в которой выживание и эвакуация важнее уничтожения каждого человеческого защитника."
STR_AT_RESOURCE_RAID_SIMULATION: Моделирование рейда за ресурсами
STR_AT_XCOM_ALERT_ANALYSIS_CELL: Аналитический центр оповещений X-COM
STR_AT_SCOUT_FLIGHT_OPERATIONS: Полёты разведчиков
STR_AT_SCOUT_FLIGHT_OPERATIONS_UFOPEDIA: "Полёты разведчиков. Определяет правила малозаметных полётов, уклонения от перехватчиков, выбора времени посадки, ограничения по численности экипажа и приоритеты отхода для первых разведывательных операций.\n\nДальнейшие исследования: Модель перехватчиков, Анализ «Скайрейнджера», Разведка силами разведчиков, Копирование летательных аппаратов. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_SCOUT_REARMAMENT_CACHE: Комплект перевооружения разведчика
STR_AT_SCOUT_RECON_OPERATION: Разведка силами разведчиков
STR_AT_SCOUT_RECON_OPERATION_UFOPEDIA: "Разведка силами разведчиков. Первый цикл операций использует экипаж разведывательного корабля для наблюдения за обороной Земли, определения времени реагирования и передачи краткого разведывательного отчёта через инопланетную логистическую сеть.\n\nДальнейшие исследования: Реакция X-COM, Тактические испытания, Разведывательный контакт. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_SECTOID_CASTE: Сектойд
STR_AT_SECTOID_CASTE_UFOPEDIA: 'Сектойд. Основной интеллектуальный ресурс земной ячейки на начальном этапе: хрупкое тело, развитые каналы управления и достаточное любопытство, позволяющее извлекать уроки из неудач. Сектойды могут продвигаться по специализированным и командным должностям, если их боевые заслуги оправдывают доверие.'
