STR_AT_ABDUCTION_CONTACT_SCENARIO: Операция по похищению
STR_AT_ABDUCTION_CONTACT_SCENARIO_UFOPEDIA: "Операция по похищению. Подготавливает группы захвата к оглушению, обездвиживанию и эвакуации живых образцов, позволяя избежать чрезмерной потери улик."
STR_AT_ABDUCTION_CONTACT_SIMULATION: Моделирование операции по похищению
STR_AT_ABDUCTION_FIELD_KIT: Полевой комплект для похищения
STR_AT_ABDUCTION_PROBE_PROTOCOL: Протокол похищения
STR_AT_ABDUCTION_PROBE_PROTOCOL_UFOPEDIA: "Протокол похищения. Определяет первоначальные стандарты захвата людей, пределы выживаемости при оглушении и правила обращения с образцами для первого контролируемого цикла похищений. Масштабные похищения и террористические операции остаются системами последующих этапов эскалации.\n\nДальнейшие исследования: Адаптация к поверхности, Логистика захвата, Контакт по похищению. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_ABDUCTION_SAMPLE: Образец после похищения
STR_AT_ABDUCTION_SAMPLE_UFOPEDIA: Образец после похищения. Биологические и поведенческие материалы, полученные в ходе контролируемой операции по захвату человека. Используется для содержания пленных, изучения видов и последующей организации допросов.
STR_AT_ABDUCTOR_CRAFT: Корабль похититель
STR_AT_ABDUCTOR_CRAFT_UFOPEDIA: Корабль похититель. Судно для захвата образцов, спроектированное с учётом оглушения, удержания и последующего отхода. Наибольшую ценность представляет в тех случаях, когда цель бесследно исчезает, а человеческие власти спорят о произошедшем.
STR_AT_ALIEN_ALLOYS_ENTRY: Инопланетные сплавы
STR_AT_ALIEN_ALLOYS_ENTRY_UFOPEDIA: Инопланетные сплавы отличаются малым весом, высокой прочностью и сложностью воспроизведения человеческой промышленностью. Они необходимы для обслуживания кораблей, строительных работ и последующего возведения сооружений на Земле.
STR_AT_ALIEN_ARTIFACTS: АРТЕФАКТЫ
STR_AT_ALIEN_EXPLOSIVES: Инопланетная взрывчатка
STR_AT_ALIEN_EXPLOSIVES_UFOPEDIA: Инопланетные гранаты - компактные средства разрушения, предназначенные для пробивания укрытий, подавления сопротивления и уничтожения чувствительных материалов. Чрезмерное использование может привести к уничтожению образцов, улик или добытых целей.
STR_AT_ALIEN_FORCES: ИНОПЛАНЕТНЫЕ ВОЙСКА
STR_AT_ALIEN_HABITAT: Инопланетное жилище
STR_AT_ALIEN_HABITAT_UFOPEDIA: Инопланетные жилища обеспечивают необходимые условия для размещённого персонала. Это жилые помещения, приспособленные к физиологии нечеловеческих существ, а не к человеческому комфорту.
STR_AT_ALIEN_LOGISTICS: ИНОПЛАНЕТНАЯ ЛОГИСТИКА
STR_AT_ALIEN_RANKS: Кастовые роли
STR_AT_ALIEN_RANKS_UFOPEDIA: 'Кастовые роли. Продвижение инопланетян определяется разрешением Кидонии, а не человеческой системой карьерного роста. Навигатор, инженер и медик - параллельные специализированные назначения, а не ступени выше солдата. Сектойды и левитаторы могут выполнять функции солдата, медика, навигатора, инженера, лидера и командира. Змеелюди могут выполнять функции солдата, навигатора, инженера, лидера и командира. Эфириалы могут выполнять функции солдата, лидера и командира. Мутонов используют в качестве солдат, навигаторов или инженеров. Кибердиски и сектоподы - роботизированные платформы террора: они получают разрешение Кидонии, но никогда не повышаются в звании. Жнецы, хризаллиды, силакоиды и целатиды - организмы террора: они получают боевой допуск, но никогда не повышаются в звании. Зомби являются остатками процесса преобразования и не имеют пути развития.'
STR_AT_ARMADA: Роли инопланетных кораблей
STR_AT_ARMORED_OPERATIVE_CORPSE: Тело человека
STR_AT_ARTIFACTS: АРТЕФАКТЫ
STR_AT_ASSEMBLE_COUNTERMEASURE_PACKAGE: Собрать комплект средств противодействия
STR_AT_BASE_EXPOSURE_MODEL: Модель обнаружения базы
STR_AT_BASE_EXPOSURE_MODEL_UFOPEDIA: Модель обнаружения базы. Прогнозирует, как запуски кораблей, операции по эвакуации, снабженческие рейсы и повторяющиеся операции могут раскрыть расположение инопланетных баз человеческой разведке.
STR_AT_BASE_EXPOSURE_RISK: Риск обнаружения базы
STR_AT_BASE_EXPOSURE_RISK_UFOPEDIA: "Риск обнаружения базы. Регулярные полёты, неосторожные схемы эвакуации и предсказуемые маршруты могут указать X-COM на местонахождение инопланетной базы. Скрытность зависит от дисциплины и расстояния.\n\nДальнейшие исследования: Сокрытие места крушения, Новая база, Местоположение базы X-COM. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_BASE_FACILITIES: БАЗОВЫЕ СООРУЖЕНИЯ
STR_AT_BATTLESHIP_CRAFT: Боевой корабль
STR_AT_BATTLESHIP_CRAFT_UFOPEDIA: Боевой корабль. Сигнал о том, что скрытность в данном регионе больше не имеет значения. Используется для подавления противника, штурма баз и решающих операций, в которых отряд может позволить себе раскрыть своё присутствие, поскольку враг, возможно, не переживёт встречи с ним.
STR_AT_BIOLOGICAL_STORES: Биологические запасы
STR_AT_BIOLOGICAL_STORES_UFOPEDIA: Биологические запасы включают инопланетную пищу, генетический материал и подготовленную основу для выращивания образцов. Они обеспечивают жизнедеятельность персонала, работы по содержанию образцов, биологическое расширение и долгосрочную адаптацию к условиям Земли.
STR_AT_CELATID_TERRORIST: Целатид
STR_AT_CELATID_TERRORIST_UFOPEDIA: Целатид. Направленное биологическое оружие, отвечающее на любое движение кислотной атакой. Его выпуск наиболее эффективен на пересечённой местности и в условиях хаоса, где человеческие укрытия превращаются из убежища в ловушку.
STR_AT_CHRYSSALID_TERRORIST: Хризалид
STR_AT_CHRYSSALID_TERRORIST_UFOPEDIA: Хризалид. Организм, способный превратить небольшую стычку в настоящую бойню, а труп - в новый боевой ресурс. Его выпуск требует строгой дисциплины, поскольку паника распространяется быстрее, чем командование успевает восстановить контроль.
STR_AT_COMMAND_NEXUS: Командный узел
STR_AT_COMMAND_NEXUS_UFOPEDIA: Командный узел координирует действия земной ячейки, обеспечивает исполнение доктрин Кидонии и служит центральным элементом сети баз. Его потеря нанесёт серьёзный ущерб местной системе командования.
STR_AT_CONCEALMENT_MATRIX: Матрица маскировки
STR_AT_CONCEALMENT_MATRIX_UFOPEDIA: Матрица маскировки скрывает излучение базы и следы перемещения. Она не делает базу неуязвимой, но позволяет выиграть время против всё более организованных поисковых операций X-COM.
STR_AT_CONSTRUCTION_MATERIAL: Строительные материалы
STR_AT_CONSTRUCTION_MATERIAL_ENTRY: Строительные материалы
STR_AT_CONSTRUCTION_MATERIAL_ENTRY_UFOPEDIA: Строительные материалы представляют собой подготовленную основу для инопланетных баз, структурный гель и компоненты, приспособленные для полевых условий. Они расходуются на расширение, ремонт и импровизированные операции на Земле.
STR_AT_CONTROLLED_TACTICAL_SIMULATION: Тактические испытания
STR_AT_CONTROLLED_TACTICAL_SIMULATION_UFOPEDIA: "Тактические испытания. Контролируемый цикл подготовки инопланетных полевых отрядов перед их отправкой на поверхность. Объединяет полевое снаряжение, доктрины и правила отхода в единую систему подготовки подразделения.\n\nДальнейшие исследования: Разведывательный контакт, Рейд за ресурсами, Контакт по похищению. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_CONTROLLED_TACTICAL_TEST_CACHE: Запас снаряжения для тактических испытаний
STR_AT_COUNTERMEASURE_PACKAGE: Комплект средств противодействия
STR_AT_COUNTERMEASURE_PACKAGE_UFOPEDIA: Комплект средств противодействия. Полевой набор ложных сигналов, средств маскировки излучения и правил выбора маршрутов, предназначенный для снижения внимания перехватчиков во время первых операций.
STR_AT_CRASH_DENIAL_CACHE: Комплект для сокрытия крушения
STR_AT_CRASH_DENIAL_CACHE_UFOPEDIA: Комплект для сокрытия крушения. Взрывчатка, дымовые средства и оборудование для эвакуации, используемые для предотвращения превращения потерь инопланетян в источник технологий и разведывательной информации для X-COM.
STR_AT_CRASH_DENIAL_DOCTRINE: Доктрина сокрытия крушений
STR_AT_CRASH_DENIAL_DOCTRINE_UFOPEDIA: "Доктрина сокрытия крушений. Объединяет оценку риска обнаружения, исследования средств противодействия и запасы для сокрытия крушений в единую доктрину, направленную на минимизацию возможностей X-COM по обнаружению и изучению потерпевших крушение объектов."
STR_AT_CRASH_SITE_DENIAL: Сокрытие места крушения
STR_AT_CRASH_SITE_DENIAL_UFOPEDIA: "Сокрытие места крушения. Устанавливает правила уничтожения улик, эвакуации выживших и сокрытия обломков в случае компрометации инопланетного корабля или наземного отряда.\n\nДальнейшие исследования: Доктрина сокрытия крушений, Эвакуация после крушения. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_CYBERDISC_TERRORIST: Кибердиск
STR_AT_CYBERDISC_TERRORIST_UFOPEDIA: 'Кибердиск. Роботизированная платформа террора сектойдов, бронированный двигатель и летающая огневая установка. Скорее напоминает инопланетный танк, чем солдата: не имеет инвентаря и званий, а нуждается лишь в допуске к эксплуатации, ремонте и модернизации.'
STR_AT_CYDONIAN_ALLOCATION: Выделение ресурсов Кидонией
STR_AT_CYDONIAN_ALLOCATION_UFOPEDIA: Выделение ресурсов Кидонией. Запросы на снабжение и разрешения на полевое подкрепление определяются военными запасами, возможностями выпуска представителей каст и командными приоритетами. Командные полномочия и логистические кредиты передаются непосредственно из Кидонии. Это не человеческие деньги, а строго определённые квоты топлива, приоритетов снабжения, доступа к персоналу и разрешений на использование инопланетных ресурсов на Земле.
STR_AT_CYDONIAN_SUPPLY_GRANT: Снабженческая квота Кидонии
STR_AT_CYDONIAN_SUPPLY_GRANT_UFOPEDIA: Снабженческая квота Кидонии. Логистическое вознаграждение, выдаваемое после того, как земная ячейка возвращает ценную разведывательную информацию, материальные доказательства или возможности для дальнейшего проникновения. Кидония поощряет успех приоритетом снабжения, а не денежными средствами человеческих государств.
STR_AT_FUNDING_DOCTRINE: Доктрина распределения ресурсов Кидонии
STR_AT_FUNDING_DOCTRINE_UFOPEDIA: Доктрина распределения ресурсов Кидонии. Правительства Земли финансируют X-COM. Инопланетные операции обеспечиваются ресурсами Кидонии, добытыми материалами, собранными биологическими запасами и захваченными местными активами, полученными посредством инфильтрации.
STR_AT_CYDONIAN_DIRECTIVE: Доктрина Кидонии
STR_AT_CYDONIAN_DIRECTIVE_UFOPEDIA: Доктрина Кидонии. Наземные операции начинаются с разведчиков, сектойдов-кураторов и оружия, уже проверенного на менее развитых мирах. Более опасные организмы и боевые машины остаются под запретом до тех пор, пока не будет оценена реакция противника и отряд не докажет, что способен возвращаться не только с обломками.
STR_AT_EARTH_ATMOSPHERIC_ANALYSIS: Атмосфера Земли
STR_AT_EARTH_ATMOSPHERIC_ANALYSIS_UFOPEDIA: "Изучение атмосферы Земли, погодных условий, световых циклов, особенностей горения, искажения сигналов и помех для датчиков. Необходимо для развития надёжных средств противодействия обнаружению и расширения региональных операций.\n\nДальнейшие исследования: Человеческое лучевое оружие, Радиолокационные средства противодействия, Рейды за ресурсами, Разведка ресурсов, Полёты на малой высоте, Копирование сканеров. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_EARTH_INTELLIGENCE: РАЗВЕДКА ЗЕМЛИ
STR_AT_EARTH_INTELLIGENCE_REPORT: Разведывательный отчёт по Земле
STR_AT_EARTH_INTELLIGENCE_REPORT_UFOPEDIA: Разведывательный отчёт по Земле. Краткая сводка о местности, поведении свидетелей, бдительности людей и предполагаемом времени реакции X-COM, полученная в ходе разведывательных операций.
STR_AT_EARTH_THEATER_RULES: Ограничения операций на Земле
STR_AT_EARTH_THEATER_RULES_UFOPEDIA: Ограничения операций на Земле. Земля - защищённая биосфера с вооружёнными государствами, радиолокационными сетями и необычайно быстро адаптирующимися ударными силами. Кидония разрешает оказывать давление, но не привлекать лишнего внимания, пока противник не начнёт тратить больше сил на преследование теней, чем на изучение улик.
STR_AT_ELERIUM_115_ENTRY: Элерий-115
STR_AT_ELERIUM_115_ENTRY_UFOPEDIA: Элерий-115 - стратегическое топливо и энергетический материал, лежащий в основе инопланетных кораблей и передового оружия. Его невозможно без труда восполнить на Земле. Расточительство, крушения и захват запасов напрямую ослабляют долгосрочные операции.
STR_AT_ELERIUM_RESERVE_PROCESSING: Переработка запасов элерия
STR_AT_ESCALATION_PROTOCOL: Эскалация по приказу Кидонии
STR_AT_ESCALATION_PROTOCOL_UFOPEDIA: Протокол эскалации. Кидония не поощряет бессмысленный шум. Более крупные корабли, организмы террора и представители высших каст допускаются к операциям только тогда, когда сохранение секретности, возврат материальных ценностей и дезориентация противника оправдывают риск раскрытия их существования.
STR_AT_ETHEREAL_CASTE: Эфириал
STR_AT_ETHEREAL_CASTE_UFOPEDIA: 'Эфириал. Вмешательство Высшего порядка в живой форме. Эфириалы это не многочисленные боевые единицы, а воплощение командной власти. Их путь ограничен тремя ступенями: солдат, лидер, командир. Каждое их появление на поле боя рискует раскрыть X-COM, кто на самом деле руководит вторжением.'
STR_AT_ETHEREAL_COMMANDER: Командир-эфириал
STR_AT_ETHEREAL_LEADER: Лидер-эфириал
STR_AT_ETHEREAL_SOLDIER: Солдат-эфириал
STR_AT_EXPOSURE_RISK_MODEL: Модель риска обнаружения
STR_AT_EXTRACTION_DOCTRINE: Доктрина эвакуации
STR_AT_EXTRACTION_DOCTRINE_UFOPEDIA: Перестрелка, выигранная ценой брошенного плазменного оружия, живых пленников или целых фрагментов корпуса, не является победой. Предпочтительный результат - бесследно исчезнувший человек, замолчавшая ферма и опоздавший отряд X-COM, прибывший на участок выжженной земли.
STR_AT_EXTRACTION_ZONE_DOCTRINE: Зоны эвакуации
STR_AT_EXTRACTION_ZONE_DOCTRINE_UFOPEDIA: "Зоны эвакуации. Определяет порядок отступления инопланетных отрядов к кораблям, защиты образцов и предотвращения попадания оставленных технологий в руки противника при приближении сил X-COM.\n\nДальнейшие исследования: Штурм базы. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_FABRICATION_CHAMBER: Производственная камера
STR_AT_FABRICATION_CHAMBER_UFOPEDIA: Производственные камеры преобразуют инопланетные ресурсы в полевые комплекты снабжения, строительные материалы и ограниченные логистические наборы для операций на Земле.
STR_AT_FALSE_TRANSPONDER_ECHOES: Ложные сигналы транспондеров
STR_AT_FALSE_TRANSPONDER_ECHOES_UFOPEDIA: "Ложные сигналы транспондеров. Использует ложные траектории, сигнальные помехи и излучение по заданному расписанию, чтобы запутать первые системы обнаружения людей. Это средство противодействия, а не абсолютная защита.\n\nДальнейшие исследования: Доктрина сокрытия крушений, Местоположение базы X-COM. Остальные предварительные условия и найденные образцы также сохраняют силу."
STR_AT_FIELD_OPERATIONS_DOCTRINE: Операции первой волны
STR_AT_FIELD_OPERATIONS_DOCTRINE_UFOPEDIA: "Операции первой волны. Даёт разрешение на регулярное развёртывание сил на Земле за пределами первоначальной ячейки сектойдов. Цель заключается не в завоевании силой, а в создании череды появлений НЛО, исчезновений людей и уничтожения улик, которые X-COM пока не в состоянии правильно истолковать.\n\nДальнейшие исследования: Разведка силами разведчиков, Рейды за ресурсами, Тактические испытания, Ночное проникновение, Засада на Скайрейнджер, Контроль паники сектойдов, Копирование баллистического оружия, Копирование тяжёлого вооружения, Копирование лазерного оружия. Остальные предварительные условия и найденные образцы также сохраняют силу."
