STR_AT_ALIEN_VICTORY_TITLE: Земля капитулирует
STR_AT_ALIEN_VICTORY_TEXT: "Сопротивление человечества потерпело поражение. Одно за другим правительства Земли отказываются от поддержки X-COM и подписывают себе приговор, отдавая собственное будущее. Они принимают наши обещания порядка и выживания. Кидония предлагает им лишь повиновение. Они ещё не понимают, какой ценой обернётся их покорность. Кампания вступает в заключительную фазу. Города охвачены огнём, воздух и моря отравлены, а человеческие армии рушатся под натиском превосходящих сил. Выжившие уже не те, что прежде. Целые поколения страдают от мутаций и разрухи. Оставшихся в живых сгоняют в трудовые лагеря, обращают в рабство под властью Кидонии, а Землю превращают в колонию Кидонии. Полезные человеческие органы и ткани изымают для использования в качестве биологического сырья. Измождённых рабочих и непригодные останки перерабатывают в топливо для биореакторов, питающих комплексы машин с искусственным интеллектом, управляющие завоёванным миром. УНИЧТОЖИТЬ ЧЕЛОВЕЧЕСТВО. Далее следует запись о поражении человечества."
STR_AT_ALIEN_DEFEAT_TITLE: Контроль над Кидонией уничтожен
STR_AT_ALIEN_DEFEAT_TEXT: "Со временем X-COM удалось восстановить наши технологии и проследить сеть вторжения до самой Кидонии. Человеческие штурмовые корабли достигли Марса. X-COM прорвала внутреннюю камеру. Командное ядро Кидонии оказалось беззащитным, и человеческое оружие теперь угрожает самому сердцу вторжения. Кидония содрогается под натиском людей. Человеческое оружие уничтожает командное ядро. Древние марсианские сооружения рушатся, и старая империя больше не в силах защитить свою родину. Командные ретрансляторы один за другим выходят из строя. Камеры выращивания перестают работать, запечатанные арсеналы погружаются во тьму, а оставшиеся на Земле ячейки теряют связь с командованием. Сеть вторжения рушится по всей планете, а человеческое сопротивление выживает. Изолированные инопланетные уцелевшие остаются без подкреплений и становятся добычей охотников среди руин разрушенных баз, пока машинный разум Кидонии распадается на безмолвные, изолированные процессы. КИДОНИЯ ЗАМОЛКЛА. Далее следует запись о победе человечества."
STR_AT_BASE_DEFENSE_BRIEFING: Штурмовые отряды X-COM прорвались в инопланетную командную ячейку. Защитите командный узел, сохраните критически важные объекты и отразите контратаку людей.
STR_AT_BASE_DEFENSE_VICTORY: Штурм X-COM отражён. Власть Кидонии остаётся непоколебимой.
STR_AT_BASE_DEFENSE_DEFEAT: Людям удалось захватить инопланетную базу. Командные полномочия Кидонии серьёзно подорваны.
STR_AT_REWARD_LIVE_HUMANS: Захват живых людей предоставляет более ценные данные о похищениях и действиях сил реагирования.
STR_AT_REWARD_HUMAN_CORPSES: Обнаружение человеческих тел поддерживает исследования по вскрытию человека и биологической адаптации.
