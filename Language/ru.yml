STR_AT_HEAVY_PLASMA_FABRICATION_TEXT: Допуск к ведению полномасштабной войны на IV уровне вторжения открывает доступ к производству нашего тяжёлого плазменного оружия в земных мастерских. Производство требует денежных средств, инопланетных сплавов и элерия. Перед отправкой в бой зарядите магазин тяжёлого плазменного излучателя.
STR_AT_HEAVY_PLASMA_CLIP_FABRICATION_TEXT: Наши боеприпасы для тяжёлого плазменного оружия становятся доступны после получения допуска к ведению полномасштабной войны на IV уровне вторжения. Земные мастерские расходуют денежные средства, инопланетные сплавы и элерий для пополнения запасов этих магазинов.
STR_AT_BLASTER_LAUNCHER_FABRICATION_TEXT: V уровень вторжения и допуск к ведению полномасштабной войны открывают возможность производства нашей управляемой бластерной пусковой установки на Земле. Мастерские расходуют денежные средства, инопланетные сплавы и элерий. Перед отправкой в бой зарядите установку бластерной бомбой и управляйте её полётом с помощью промежуточных точек маршрута.
STR_AT_BLASTER_BOMB_FABRICATION_TEXT: Наши управляемые бластерные боеприпасы разрешены к применению на V уровне вторжения в рамках директивы полномасштабной войны. Земные мастерские расходуют денежные средства, инопланетные сплавы и элерий на производство каждой бомбы. Используйте её вместе с бластерной пусковой установкой.

