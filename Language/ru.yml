STR_AT_PROBE_PULSE_EMITTER_UFOPEDIA: Лёгкое вооружение инопланетного корабля, установленное на разведывательном корабле. Использует существующую графику, но считается инопланетным оборудованием, а не человеческой лазерной пушкой.
STR_AT_UFO_PLASMA_EMITTER: Плазменный излучатель НЛО
STR_AT_UFO_PLASMA_EMITTER_UFOPEDIA: Стандартный плазменный излучатель инопланетного корабля. Использует существующую графику и звуковые эффекты, сохраняя при этом инопланетные комплектации кораблей свободными от обозначений вооружения X-COM.
STR_SMALL_LAUNCHER: Оглушающая пусковая установка
STR_SMALL_LAUNCHER_UFOPEDIA: Инопланетная оглушающая пусковая установка, используемая для похищения и захвата людей. Стреляет оглушающими бомбами и не является человеческим оружием X-COM.
STR_AT_ALIEN_PSI_FOCUS: Инопланетный пси-фокус
STR_AT_ALIEN_PSI_FOCUS_UFOPEDIA: Инопланетные пси-способности основаны на кастовой дисциплине, нейронной концентрации и командных полномочиях. Исследование подавления пси-способностей сектойдов открывает лидерам сектойдов возможность вызывать панику. Доктрина пси-доминирования открывает полноценные штатные действия «Паника» и «Контроль разума» для психических каст, включая лидеров сектойдов. Каждое действие требует 25 ЕД.
STR_AT_ALIEN_PSI_PANIC_FOCUS: Инопланетный пси-фокус (паника)
STR_AT_ALIEN_PSI_PANIC_FOCUS_UFOPEDIA: Ранний вариант инопланетного пси-фокуса, используемый лидерами сектойдов исключительно для наведения паники. Это не человеческий пси-усилитель, и он не позволяет контролировать разум.
STR_AT_ALIEN_PSI_DOMINANCE_FOCUS: Инопланетный пси-фокус (доминирование)
STR_AT_ALIEN_PSI_DOMINANCE_FOCUS_UFOPEDIA: Продвинутый инопланетный пси-фокус, используемый лидерами сектойдов, командирами сектойдов и эфириалами после освоения доктрины пси-доминирования. Психические касты получают штатные действия «Паника» и «Контроль разума». Каждое действие требует 25 ЕД.
STR_AT_SECTOID_PSI_SUPPRESSION: "Контроль паники сектойдов"
STR_AT_SECTOID_PSI_SUPPRESSION_UFOPEDIA: "Командные касты сектойдов могут вызывать панику в восприимчивом человеческом сознании. Это контролируемое психологическое воздействие; контроль разума требует дальнейших пси-исследований. Обычные солдаты-сектойды не получают новых пси-способностей.\n\nДальнейшие исследования: Высшее командование пси-связи. Остальные предварительные условия и требования к захваченным образцам сохраняются."
STR_AT_PSI_DOMINANCE_DOCTRINE: Высшее командование пси-связи
STR_AT_PSI_DOMINANCE_DOCTRINE_UFOPEDIA: "Пси-координация Кидонии позволяет подходящим командным кастам инопланетян не только вызывать панику, но и пытаться контролировать разум. Ограничения по видам и кастам сохраняются. Это исследование открывает возможность задействовать эфириалов, допустить к использованию сектоподов и воспроизводить человеческий пси-интерфейс. Для каждого из этих направлений по-прежнему необходимы собственные предварительные условия.\n\nДальнейшие исследования: Высший допуск эфириалов, разрешение на осадные операции с сектоподами, пси-интерфейс. Остальные предварительные условия и требования к захваченным образцам сохраняются."
STR_AT_ETHEREAL_COMMAND_AUTHORIZATION: Высший допуск эфириалов
STR_AT_ETHEREAL_COMMAND_AUTHORIZATION_UFOPEDIA: "X-COM стала достаточно опасной, чтобы оправдать непосредственное задействование эфириалов. Теперь земное командование может запрашивать войска эфириалов через существующий канал подкреплений. Более высокие командные полномочия по-прежнему заслуживаются службой, а не приобретаются за деньги."
STR_AT_EARTH_ADAPTATION_PROTOCOL: "Адаптация к Земле"
STR_AT_EARTH_ADAPTATION_PROTOCOL_UFOPEDIA: "Гравитация, атмосфера и полевые условия Земли изучены для дополнительных видов Кидонии. Теперь можно запрашивать змеелюдей, силакоидов и целатидов. Змеелюди используют полевое снаряжение, силакоиды и целатиды атакуют естественными способами."
STR_AT_BIOWAR_GESTATION_PROTOCOL: "Развёртывание хризалидов"
STR_AT_BIOWAR_GESTATION_PROTOCOL_UFOPEDIA: "Захваченный биологический материал позволяет организовать контролируемое развёртывание хризалидов. Земное командование может запрашивать хризалидов и создавать запасы биологических организмов террора при наличии необходимых ресурсов. Хризалиды сохраняют свои естественные атаки и способность превращать жертв в боевые единицы."
STR_AT_HEAVY_WAR_DIRECTIVE: Допуск к полномасштабной войне
STR_AT_HEAVY_WAR_DIRECTIVE_UFOPEDIA: "Скрытого давления больше недостаточно для сдерживания организованного человеческого сопротивления. Теперь можно запрашивать войска мутонов, а мастерские могут собирать резервы боевых платформ. Разрешение на приобретение кибердисков предоставляется в рамках допуска к применению сил террора. Мутонские войска используют оружие, а кибердиски сохраняют встроенные пушки. Для использования сектоподов требуется отдельное исследование.\n\nДальнейшие исследования: Разрешение на осадные операции с сектоподами. Остальные предварительные условия и требования к захваченным образцам сохраняются."
STR_AT_SECTOID_REINFORCEMENT_BATCH: Партия подкрепления сектойдов
STR_AT_TERROR_ORGANISM_GESTATION: Выращивание организмов террора
STR_AT_CYBERNETIC_WARFRAME_ASSEMBLY: Сборка кибернетических боевых платформ
STR_AT_V1_PROGRESSION_LOCK_NOTE: Ограничение доктрины версии 1.0 - развитие инопланетных сил осуществляется через повышение статуса Кидонии, перераспределение, получение командных полномочий, допуск к пси-связи, повышение боевого класса и оптимизацию подразделений. Навигатор, медик и инженер остаются специализированными функциями; лидер и командир - это командные роли. Организмы террора и машины никогда не проходят повышение в звании по человеческому образцу.
