STR_AT_CYDONIAN_REPORT_EARTH_CAPITULATION_READY: "Кидония разрешает применение директивы «Уничтожение человечества»."
STR_AT_CYDONIAN_REPORT_XCOM_CYDONIA_ASSAULT: "Высшее командование Кидонии предупреждает о готовности X-COM к штурму Кидонии."
