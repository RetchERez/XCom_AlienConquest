STR_AT_HUMAN_RECOVERY_DOCTRINE_UFOPEDIA: Мёртвые люди учитываются как человеческие тела и используются для поддержки исследования «Вскрытие человека». Оглушённые или живые люди считаются ценными объектами похищения и источниками разведывательной информации, а не отдельными темами исследований.
