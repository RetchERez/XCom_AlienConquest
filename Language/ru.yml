STR_TERROR_MISSION: "ТЕРРОРИСТИЧЕСКАЯ ОПЕРАЦИЯ"
STR_TERROR_MISSION_BRIEFING: "Убейте не менее восьми мирных жителей, чтобы завершить эту террористическую операцию. Уничтожьте или отразите силы X-COM и сохраните инопланетные ресурсы.\n\nОдной лишь победы над X-COM недостаточно. Выполните задачу по уничтожению мирных жителей до того, как падёт последний боец сил реагирования. Прервите операцию, если сопротивление станет слишком серьёзным."
STR_AT_XCOM_GROUND_RESPONSE_REACHED_SITE: Наземные силы реагирования X-COM достигли места проведения операции. Начинается тактический бой.
